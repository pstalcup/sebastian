name: Build and deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  build-path: "dist"
  node-version: "24"

jobs:
  testBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.node-version }}

      - name: Build
        run: yarn run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.node-version }}

      - name: Type checking
        run: yarn run check

      - name: Linting
        run: yarn run lint

      - name: Tests
        run: yarn run test

  deploy:
    runs-on: ubuntu-latest
    needs: [testBuild, lint]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: "write"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up project
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.node-version }}

      - name: Build
        run: yarn run build

      - name: Push to Release
        env:
          FOLDER: ${{ env.build-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          msg="Build: (${GITHUB_SHA}) $(git log -1 --format=%s)"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          work="$(mktemp -d)"
          if git ls-remote --exit-code --heads "$remote" release >/dev/null; then
            git clone --quiet --depth 1 --branch release "$remote" "$work"
          else
            git init --quiet -b release "$work"
            git -C "$work" remote add origin "$remote"
          fi
          find "$work" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$FOLDER"/. "$work"/
          cd "$work"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to release"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "$msg"
          git push --quiet origin release
